counter_set_id: default_calibration
description: Legacy minimal Nsight Compute counter set retained for smoke and compatibility checks.
tool: ncu
replay_mode: kernel
target_processes: all
counters:
  - smsp__average_warps_issue_stalled_long_scoreboard_per_issue_active.avg
  - sm__warps_active.avg.pct_of_peak_sustained_active
  - smsp__inst_executed.sum
minimum_availability: 0.9
notes: Prefer compute_lite for GEMM reportable studies and memory_lite for LayerNorm reportable studies.
