counter_set_id: memory_activity_lite
description: Memory-plus-activity Nsight Compute counter set for regime-aware LayerNorm studies.
tool: ncu
replay_mode: kernel
target_processes: all
kernel_name_regex: layer_norm_kernel
kernel_family_filters:
  - layernorm
counters:
  - dram__bytes.avg
  - dram__throughput.avg.pct_of_peak_sustained_elapsed
  - l1tex__t_bytes_pipe_lsu_mem_global_op_ld.avg
  - l1tex__t_sector_pipe_lsu_mem_global_op_ld_hit_rate.pct
  - sm__warps_active.avg.pct_of_peak_sustained_active
  - smsp__warp_issue_stalled_lg_throttle_per_warp_active.pct
  - smsp__warp_issue_stalled_long_scoreboard_per_warp_active.pct
minimum_availability: 0.9
notes: >
  Extends memory_lite with one activity signal so LayerNorm regime studies can
  distinguish bandwidth-heavy from latency-sensitive behavior under the same matched budget.
