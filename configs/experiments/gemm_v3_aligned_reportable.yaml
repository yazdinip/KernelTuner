selector_modes:
  - prune_rank
  - prune_rank_profiled
  - prune_rank_revised
baselines:
  - default_config
  - naive_random_search
budgets:
  max_candidates: 648
  max_benchmarks: 16
  max_profiles: 6
  wall_clock_limit_s: 3600
calibration_split: 0.67
held_out_split: 0.33
artifact_root: artifacts
counter_set_id: compute_lite
profile_policy:
  counter_set_id: compute_lite
  shape_sampling_mode: per_workload_class_top1
  max_shapes_per_config: 2
  aggregation_mode: mean
  availability_failure_mode: fail_run
reportability_policy:
  enforce_preflight: true
  require_workload_class_labels: true
  require_stratified_split: true
  minimum_calibration_shapes: 4
  minimum_held_out_shapes: 2
  minimum_held_out_per_workload_class: 1
  abort_on_incompatible_counter_set: true
budget_id: gemm_v3_reportable_matched
benchmark_settings:
  warmup_iterations: 40
  timed_iterations: 120
  timing_backend: cuda_events
profiling_settings:
  replay_mode: kernel
  timeout_s: 300
  cooldown_s: 2.0
execution_settings:
  isolate_triton_cache: true
  expected_partition: gpunodes
  expected_gpu_name: NVIDIA RTX A6000
  cuda_home: /usr/local/cuda-12.9
analysis_settings:
  reportability_target: rtx_a6000_pool
  workload_id: gemm_aligned_v3_splitk
seed: 7
notes: >
  Phase 3 aligned GEMM context experiment. This is a supporting reference workload
  used to refresh the H3 workload-representativeness contrast under split-K.
