  - shape_id: gemm_m512_n512_k512_fp16_rowmajor
    dimensions: {m: 512, n: 512, k: 512}
    dtype: fp16
    layout: row_major
    workload_class: aligned_square
  - shape_id: gemm_m1024_n1024_k1024_fp16_rowmajor
    dimensions: {m: 1024, n: 1024, k: 1024}
    dtype: fp16
    layout: row_major
    workload_class: aligned_square
  - shape_id: gemm_m2048_n2048_k1024_fp16_rowmajor
    dimensions: {m: 2048, n: 2048, k: 1024}
    dtype: fp16
    layout: row_major
    workload_class: aligned_square
  - shape_id: gemm_m2048_n2048_k2048_fp16_rowmajor
    dimensions: {m: 2048, n: 2048, k: 2048}
    dtype: fp16
    layout: row_major
    workload_class: aligned_square
  - shape_id: gemm_m4096_n4096_k2048_fp16_rowmajor
    dimensions: {m: 4096, n: 4096, k: 2048}
    dtype: fp16
    layout: row_major
    workload_class: aligned_square
  - shape_id: gemm_m4096_n2048_k1024_fp16_rowmajor
    dimensions: {m: 4096, n: 2048, k: 1024}
