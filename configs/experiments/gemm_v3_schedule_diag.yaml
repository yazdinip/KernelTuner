experiment_id: gemm_v3_schedule_diag
study_kind: diagnostic_only
kernels:
  - gemm_v3
selector_version: phase3_gemm_v3_diag
selector_revision_id: v4_transfer_safe_profiled
explicit_configs:
  - {block_m: 128, block_n: 128, block_k: 32, group_size_m: 8, num_warps: 4, num_stages: 2, split_k: 1}
  - {block_m: 128, block_n: 128, block_k: 32, group_size_m: 4, num_warps: 4, num_stages: 4, split_k: 1}
  - {block_m: 256, block_n: 256, block_k: 32, group_size_m: 8, num_warps: 8, num_stages: 4, split_k: 1}
  - {block_m: 128, block_n: 128, block_k: 32, group_size_m: 4, num_warps: 4, num_stages: 4, split_k: 2}
  - {block_m: 256, block_n: 128, block_k: 64, group_size_m: 8, num_warps: 8, num_stages: 4, split_k: 4}
shapes:
  - shape_id: gemm_m1024_n1024_k1024_fp16_rowmajor
    dimensions: {m: 1024, n: 1024, k: 1024}
    dtype: fp16
    layout: row_major
    workload_class: square_compute
  - shape_id: gemm_m4096_n1024_k1024_fp16_rowmajor
    dimensions: {m: 4096, n: 1024, k: 1024}
    dtype: fp16
    layout: row_major
    workload_class: m_dominant
  - shape_id: gemm_m1024_n4096_k1024_fp16_rowmajor
    dimensions: {m: 1024, n: 4096, k: 1024}
    dtype: fp16
    layout: row_major
    workload_class: n_dominant
  - shape_id: gemm_m1536_n1792_k960_fp16_rowmajor
    dimensions: {m: 1536, n: 1792, k: 960}
    dtype: fp16
    layout: row_major
    workload_class: edge_nondivisible
selector_modes:
  - prune_rank
  - prune_rank_revised
baselines:
  - default_config
budgets:
  max_candidates: 5
  max_benchmarks: 5
  max_profiles: 5
  wall_clock_limit_s: 2400
calibration_split: 0.67
held_out_split: 0.33
artifact_root: artifacts
counter_set_id: compute_schedule_diag
profile_policy:
  counter_set_id: compute_schedule_diag
  shape_sampling_mode: per_workload_class_top1
  max_shapes_per_config: 4
  aggregation_mode: mean
  availability_failure_mode: downgrade_to_diagnostic
reportability_policy:
  enforce_preflight: false
  require_workload_class_labels: true
  require_stratified_split: true
  minimum_calibration_shapes: 4
  minimum_held_out_shapes: 4
  minimum_held_out_per_workload_class: 1
  abort_on_incompatible_counter_set: false
budget_id: gemm_v3_schedule_diag_budget
benchmark_settings:
  warmup_iterations: 30
  timed_iterations: 90
  timing_backend: cuda_events
profiling_settings:
  replay_mode: kernel
  timeout_s: 300
  cooldown_s: 2.0
execution_settings:
  isolate_triton_cache: true
  expected_partition: gpunodes
  expected_gpu_name: NVIDIA RTX A6000
  cuda_home: /usr/local/cuda-12.9
analysis_settings:
  reportability_target: rtx_a6000_pool
  workload_id: gemm_schedule_diag_v3
seed: 7
notes: >
  Phase 3 diagnostic GEMM run that uses the schedule-diagnostic Nsight set and
  emits frontier diagnostics for a curated family subset: default-like,
  balanced no-split-k, oversized parent-like, transfer-safe split-k, and a
  deliberately poor oversized split-k family.
