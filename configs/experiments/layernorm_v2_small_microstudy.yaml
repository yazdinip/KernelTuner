experiment_id: layernorm_v2_small_microstudy
study_kind: reportable
kernels:
  - layernorm_v2
selector_version: phase3_layernorm_micro
selector_revision_id: v2_validation
shapes:
  - shape_id: layernorm_rows128_hidden768_fp16_rowmajor
    dimensions: {rows: 128, hidden: 768}
    dtype: fp16
    layout: row_major
    workload_class: small_batch
  - shape_id: layernorm_rows128_hidden1024_fp16_rowmajor
    dimensions: {rows: 128, hidden: 1024}
    dtype: fp16
    layout: row_major
    workload_class: small_batch
  - shape_id: layernorm_rows128_hidden2048_fp16_rowmajor
    dimensions: {rows: 128, hidden: 2048}
    dtype: fp16
    layout: row_major
    workload_class: small_batch
  - shape_id: layernorm_rows128_hidden4096_fp16_rowmajor
    dimensions: {rows: 128, hidden: 4096}
    dtype: fp16
    layout: row_major
    workload_class: small_batch
selector_modes:
  - prune_rank
  - prune_rank_profiled
  - prune_rank_revised
baselines:
  - default_config
  - naive_random_search
budgets:
  max_candidates: 36
  max_benchmarks: 12
  max_profiles: 4
  wall_clock_limit_s: 2400
calibration_split: 0.67
held_out_split: 0.33
artifact_root: artifacts
counter_set_id: memory_activity_lite
profile_policy:
  counter_set_id: memory_activity_lite
  shape_sampling_mode: all_calibration
  max_shapes_per_config: 3
  aggregation_mode: mean
  availability_failure_mode: fail_run
reportability_policy:
  enforce_preflight: true
  require_workload_class_labels: true
  require_stratified_split: true
  minimum_calibration_shapes: 3
  minimum_held_out_shapes: 1
  minimum_held_out_per_workload_class: 1
  abort_on_incompatible_counter_set: true
budget_id: layernorm_v2_micro_matched
benchmark_settings:
  warmup_iterations: 40
  timed_iterations: 120
  timing_backend: cuda_events
profiling_settings:
  replay_mode: kernel
  timeout_s: 300
  cooldown_s: 2.0
execution_settings:
  isolate_triton_cache: true
  expected_partition: gpunodes
  expected_gpu_name: NVIDIA RTX A6000
  cuda_home: /usr/local/cuda-12.9
analysis_settings:
  reportability_target: rtx_a6000_pool
  workload_id: layernorm_small_batch_microstudy
seed: 7
notes: >
  Phase 3 bounded LayerNorm small-batch microstudy used to determine whether
  rows_per_program becomes an active and stable regime lever.
