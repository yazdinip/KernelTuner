kernel_id: gemm_v3
family: gemm
description: >
  Phase 3 Triton GEMM kernel specification. This extends the expanded v2 tile and
  launch-grouping surface with one new orthogonal schedule family: split-K
  decomposition along the reduction dimension.
shape_schema:
  required_dims:
    - m
    - n
    - k
  required_metadata:
    - dtype
    - layout
dtype_support:
  - fp16
  - bf16
config_parameters:
  block_m: [64, 128, 256]
  block_n: [64, 128, 256]
  block_k: [32, 64]
  group_size_m: [1, 4, 8]
  num_warps: [4, 8]
  num_stages: [2, 4]
  split_k: [1, 2, 4]
reference_impl: torch.matmul
supports_profiling: true
correctness_policy:
  atol: 1.0e-2
  rtol: 1.0e-2
  reference_dtype: fp32
default_config:
  block_m: 128
  block_n: 128
  block_k: 32
  group_size_m: 8
  num_warps: 4
  num_stages: 2
  split_k: 1
supported_knob_families:
  - tile_shape
  - block_k
  - launch_grouping
  - pipeline_depth
  - warp_count
  - split_k
expected_signal_families:
  - compile
  - compute_profile
  - schedule_diag
tags:
  - phase3
  - triton
  - gemm-primary
  - split-k
