kernel_id: layernorm_final
family: layernorm
description: >
  Final paper-facing LayerNorm specification. This preserves the regime-aware
  Phase 2 surface while retiring rows_per_program from the mainline reportable
  space.
shape_schema:
  required_dims:
    - rows
    - hidden
  required_metadata:
    - dtype
    - layout
dtype_support:
  - fp16
  - bf16
config_parameters:
  block_size: [1024, 2048, 4096]
  num_warps: [4, 8]
  num_stages: [2, 4]
reference_impl: torch.nn.functional.layer_norm
supports_profiling: true
correctness_policy:
  atol: 2.0e-2
  rtol: 2.0e-2
  reference_dtype: fp32
default_config:
  block_size: 4096
  num_warps: 4
  num_stages: 2
supported_knob_families:
  - block_size
  - warp_count
  - pipeline_depth
expected_signal_families:
  - compile
  - memory_profile
  - activity_profile
tags:
  - phase6
  - paper-mainline
  - layernorm-secondary
