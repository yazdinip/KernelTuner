study_id: gemm_final_stability_extension
hypotheses: []
run_groups:
  - group_id: gemm_final_stability
    experiment_ids: [gemm_final_stability_reportable]
    include_latest_runs: 20
    kernel_family: gemm
    selector_version: phase7_gemm_final_stability
    counter_set_id: compute_lite
    budget_id: gemm_final_stability_matched
group_by:
  - kernel_family
  - workload_class
  - selector_version
  - selector_revision_id
  - counter_set_id
  - budget_id
  - seed
primary_metric: geomean_speedup_vs_default_config
secondary_metrics:
  - speedup_vs_naive_random_search
  - winner_rate
  - regret_vs_best_measured_calibration
  - selection_agreement
  - stability_band
  - signal_runtime_correlation
  - counter_availability
reportability_filter: true
environment_filter:
  gpu_name: NVIDIA RTX A6000
comparison_rules:
  repeatability_runs: 5
  robustness_seeds: [7, 19, 43, 61, 97]
output_root: artifacts/studies
