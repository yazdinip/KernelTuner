study_id: gemm_v2_baseline_mapping
hypotheses:
  - hypothesis_id: H1_phase2_gemm
    description: >
      On the expanded representative GEMM space, cheap compile-ranked selection still
      lags the best reachable held-out result.
    clauses:
      - left:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_v2_representative
          kernel_family: gemm
          strategy_id: naive_random_search
          reduction: mean
        comparator: greater_than
        right:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_v2_representative
          kernel_family: gemm
          strategy_id: prune_rank
          reduction: mean
        minimum_delta: 0.02
  - hypothesis_id: H4_phase2_gemm
    description: >
      The frontier-aware revised selector continues to beat the compile-ranked parent
      on the expanded representative GEMM space.
    clauses:
      - left:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_v2_representative
          kernel_family: gemm
          strategy_id: prune_rank_revised
          selector_version: phase2_gemm_v2
          selector_revision_id: v3_h4_targeted
          reduction: mean
        comparator: greater_than
        right:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_v2_representative
          kernel_family: gemm
          strategy_id: prune_rank
          selector_version: phase2_gemm_v2
          reduction: mean
        minimum_delta: 0.02
run_groups:
  - group_id: gemm_v2_representative
    experiment_ids: [gemm_v2_reportable]
    include_latest_runs: 6
    kernel_family: gemm
    selector_version: phase2_gemm_v2
    counter_set_id: compute_lite
    budget_id: gemm_v2_reportable_matched
group_by:
  - kernel_family
  - workload_class
  - selector_version
  - selector_revision_id
  - counter_set_id
  - budget_id
  - seed
primary_metric: geomean_speedup_vs_default_config
secondary_metrics:
  - speedup_vs_naive_random_search
  - winner_rate
  - regret_vs_best_measured_calibration
  - selection_agreement
  - stability_band
  - signal_runtime_correlation
  - counter_availability
reportability_filter: true
environment_filter:
  gpu_name: NVIDIA RTX A6000
comparison_rules:
  repeatability_runs: 3
  robustness_seeds: [7, 19, 43]
output_root: artifacts/studies
