study_id: h13_confirmation_g3
hypotheses:
  - hypothesis_id: H1
    description: Cheap compile signals prune obvious losers, but do not reliably rank near-tied GEMM configs.
    clauses:
      - left:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_representative
          kernel_family: gemm
          strategy_id: prune_rank
          reduction: mean
        comparator: greater_than_or_equal
        right:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_representative
          kernel_family: gemm
          strategy_id: prune_only
          reduction: mean
        minimum_delta: 0.0
      - left:
          source: stability_report
          metric: stability_band
          group_id: gemm_representative
          kernel_family: gemm
          strategy_id: prune_rank
          reduction: mean
        comparator: greater_than
        right_constant: 0.05
  - hypothesis_id: H3
    description: The aligned GEMM workload overstates selector quality relative to the representative workload.
    clauses:
      - left:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_current_aligned
          kernel_family: gemm
          strategy_id: prune_rank
          reduction: mean
        comparator: greater_than
        right:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: gemm_representative
          kernel_family: gemm
          strategy_id: prune_rank
          reduction: mean
        minimum_delta: 0.02
run_groups:
  - group_id: gemm_current_aligned
    experiment_ids: [gemm_aligned_reportable_g3_requal]
    include_latest_runs: 6
    kernel_family: gemm
    workload_class: aligned
    selector_version: v2_validation
    selector_revision_id: v2_validation
    counter_set_id: compute_lite
    budget_id: gemm_aligned_matched_v2
  - group_id: gemm_representative
    experiment_ids: [gemm_reportable_g3_requal]
    include_latest_runs: 6
    kernel_family: gemm
    workload_class: representative
    selector_version: v2_validation
    selector_revision_id: v2_validation
    counter_set_id: compute_lite
    budget_id: gemm_reportable_matched_v2
group_by:
  - kernel_family
  - workload_class
  - selector_version
  - counter_set_id
  - budget_id
  - seed
primary_metric: geomean_speedup_vs_default_config
secondary_metrics:
  - speedup_vs_naive_random_search
  - speedup_vs_naive_grid_search
  - winner_rate
  - regret_vs_best_measured_calibration
  - selection_agreement
  - stability_band
  - signal_runtime_correlation
  - counter_availability
reportability_filter: true
environment_filter:
  gpu_name: NVIDIA RTX A6000
comparison_rules:
  repeatability_runs: 3
  robustness_seeds: [7, 19, 43]
output_root: artifacts/studies
