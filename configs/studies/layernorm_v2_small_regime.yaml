study_id: layernorm_v2_small_regime
hypotheses:
  - hypothesis_id: H2_small_regime
    description: >
      Under the small-batch LayerNorm regime, limited profiling improves held-out
      selection quality over compile-only ranking.
    clauses:
      - left:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: layernorm_small_batch
          kernel_family: layernorm
          workload_class: small_batch
          strategy_id: prune_rank_profiled
          reduction: mean
        comparator: greater_than
        right:
          source: strategy_rows
          metric: geomean_speedup_vs_default_config
          group_id: layernorm_small_batch
          kernel_family: layernorm
          workload_class: small_batch
          strategy_id: prune_rank
          reduction: mean
        minimum_delta: 0.02
run_groups:
  - group_id: layernorm_small_batch
    experiment_ids: [layernorm_v2_small_reportable]
    include_latest_runs: 6
    kernel_family: layernorm
    workload_class: small_batch
    selector_version: phase2_layernorm_v2
    counter_set_id: memory_activity_lite
    budget_id: layernorm_v2_regime_matched
group_by:
  - kernel_family
  - workload_class
  - selector_version
  - selector_revision_id
  - counter_set_id
  - budget_id
  - seed
primary_metric: geomean_speedup_vs_default_config
secondary_metrics:
  - speedup_vs_naive_random_search
  - winner_rate
  - regret_vs_best_measured_calibration
  - selection_agreement
  - stability_band
  - signal_runtime_correlation
  - counter_availability
reportability_filter: true
environment_filter:
  gpu_name: NVIDIA RTX A6000
comparison_rules:
  repeatability_runs: 3
  robustness_seeds: [7, 19, 43]
output_root: artifacts/studies
